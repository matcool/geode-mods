name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - target: win
        - target: macm1
        - target: macintel
        - target: ios
        - target: android32
        - target: android64

    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        continue-on-error: ${{ matrix.config.target == 'macintel' || matrix.config.target == 'macm1' || matrix.config.target == 'ios' || matrix.config.target == 'android32' }}
        uses: geode-sdk/build-geode-mod-docker@v1
        with:
          target: ${{ matrix.config.target }}
          upload: true
          sdk: 6.0.0-beta.1

  package:
    name: Package builds
    runs-on: ubuntu-latest
    # run even if one of the platforms fails
    if: '!cancelled()'
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@v1
        with:
          upload: true

